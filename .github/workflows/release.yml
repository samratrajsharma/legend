name: Release to PyPI

# Manual by default (Actions tab → "Release to PyPI" → Run workflow) — publishing currently
# happens via `twine upload` with an API token, so the automatic tag trigger is disabled to
# avoid failing runs.
#
# To switch to automatic, token-free publishing on every version tag:
#   1) On PyPI: project legend-lens → Publishing → add a Trusted Publisher
#      (owner: samratrajsharma, repo: legend, workflow: release.yml, environment: pypi).
#   2) Uncomment the `push: tags` trigger below.
#   3) Stop running `twine` by hand — just bump the version, commit, and `git tag vX.Y.Z`.
on:
  workflow_dispatch:
  # push:
  #   tags:
  #     - "v*"

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/legend-lens/
    permissions:
      id-token: write   # required for PyPI Trusted Publishing (OIDC) — no API token stored
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Tag must match pyproject version
        run: |
          python - <<'PY'
          import os, sys, tomllib
          tag = os.environ["GITHUB_REF_NAME"].lstrip("v")
          ver = tomllib.load(open("pyproject.toml", "rb"))["project"]["version"]
          print(f"tag={tag}  pyproject={ver}")
          if tag != ver:
              sys.exit(f"ERROR: tag '{tag}' != pyproject version '{ver}'. Bump version in pyproject.toml before tagging.")
          PY

      - name: Build the frontend bundle + sdist/wheel
        run: |
          python -m pip install --upgrade build
          python scripts/build.py
          python -m build

      - name: Verify the wheel actually contains the UI bundle
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          whl = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(whl).namelist()
          assets = [n for n in names if n.startswith("legend_app/web/assets/")]
          print("wheel:", whl)
          print("bundled assets:", assets)
          if not assets:
              sys.exit("ERROR: wheel has no legend_app/web/assets/* — the UI bundle is missing, refusing to publish")
          PY

      - name: Publish to PyPI (Trusted Publishing)
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          skip-existing: true   # don't fail if that version was already uploaded (e.g. via twine)
